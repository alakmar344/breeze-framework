<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Preact Benchmark</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    .btn { padding: 6px 12px; margin: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    td, th { padding: 8px; border-top: 1px solid #ddd; text-align: left; }
    .col-md-1 { width: 10%; }
    .col-md-4 { width: 40%; }
    .col-md-6 { width: 40%; }
    .danger { background-color: #f2dede; }
    .lbl { cursor: pointer; color: #337ab7; text-decoration: none; }
    .remove { cursor: pointer; color: red; }
  </style>
  <script src="/vendor/preact.umd.js"></script>
</head>
<body>
  <div id="main"></div>
  <script>
    const adjectives = ["pretty", "large", "big", "small", "tall", "short", "long", "handsome", "plain", "quaint", "clean", "elegant", "easy", "angry", "crazy", "helpful", "mushy", "odd", "unsightly", "adorable", "important", "inexpensive", "cheap", "expensive", "fancy"];
    const colours = ["red", "yellow", "blue", "green", "pink", "brown", "purple", "white", "black", "orange"];
    const nouns = ["table", "chair", "house", "bbq", "desk", "car", "pony", "cookie", "sandwich", "burger", "pizza", "mouse", "keyboard"];

    let nextId = 1;
    function _random(max) { return Math.round(Math.random() * 1000) % max; }
    function buildData(count) {
      const data = new Array(count);
      for (let i = 0; i < count; i++) {
        data[i] = {
          id: nextId++,
          label: adjectives[_random(adjectives.length)] + " " + colours[_random(colours.length)] + " " + nouns[_random(nouns.length)]
        };
      }
      return data;
    }

    const { h, render, Component } = preact;

    class App extends Component {
      constructor() {
        super();
        this.state = { data: [], selected: null };
      }

      run = () => { this.setState({ data: buildData(1000), selected: null }); };
      runlots = () => { this.setState({ data: buildData(10000), selected: null }); };
      add = () => { this.setState({ data: this.state.data.concat(buildData(1000)) }); };
      update = () => {
        const next = this.state.data.slice();
        for (let i = 0; i < next.length; i += 10) {
          next[i] = { ...next[i], label: next[i].label + ' !!!' };
        }
        this.setState({ data: next });
      };
      clear = () => { this.setState({ data: [], selected: null }); };
      swaprows = () => {
        const d = this.state.data.slice();
        if (d.length > 998) {
          const temp = d[4];
          d[4] = d[997];
          d[997] = temp;
          this.setState({ data: d });
        }
      };

      select = (id) => { this.setState({ selected: id }); };
      remove = (id) => {
        this.setState({ data: this.state.data.filter(item => item.id !== id) });
      };

      render() {
        const { data, selected } = this.state;
        return h('div', null,
          h('h1', null, 'Preact Benchmark'),
          h('div', null,
            h('button', { id: 'run', className: 'btn', onClick: this.run }, 'Create 1,000 rows'),
            h('button', { id: 'runlots', className: 'btn', onClick: this.runlots }, 'Create 10,000 rows'),
            h('button', { id: 'add', className: 'btn', onClick: this.add }, 'Append 1,000 rows'),
            h('button', { id: 'update', className: 'btn', onClick: this.update }, 'Update every 10th row'),
            h('button', { id: 'clear', className: 'btn', onClick: this.clear }, 'Clear'),
            h('button', { id: 'swaprows', className: 'btn', onClick: this.swaprows }, 'Swap Rows')
          ),
          h('table', null,
            h('tbody', { id: 'tbody' },
              data.map(item => h('tr', {
                key: item.id,
                className: selected === item.id ? 'danger' : ''
              },
                h('td', { className: 'col-md-1' }, item.id),
                h('td', { className: 'col-md-4' },
                  h('a', { className: 'lbl', onClick: () => this.select(item.id) }, item.label)
                ),
                h('td', { className: 'col-md-1' },
                  h('a', { className: 'remove', onClick: () => this.remove(item.id) }, '✖')
                ),
                h('td', { className: 'col-md-6' })
              ))
            )
          )
        );
      }
    }

    render(h(App), document.getElementById('main'));
    window.__framework_ready = true;
  </script>
</body>
</html>
