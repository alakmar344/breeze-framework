<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vue 3 Benchmark</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    .btn { padding: 6px 12px; margin: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    td, th { padding: 8px; border-top: 1px solid #ddd; text-align: left; }
    .col-md-1 { width: 10%; }
    .col-md-4 { width: 40%; }
    .col-md-6 { width: 40%; }
    .danger { background-color: #f2dede; }
    .lbl { cursor: pointer; color: #337ab7; text-decoration: none; }
    .remove { cursor: pointer; color: red; }
  </style>
  <script src="/vendor/vue.global.prod.js"></script>
</head>
<body>
  <div id="main">
    <h1>Vue 3 Benchmark</h1>
    <div>
      <button id="run" class="btn" @click="run">Create 1,000 rows</button>
      <button id="runlots" class="btn" @click="runlots">Create 10,000 rows</button>
      <button id="add" class="btn" @click="add">Append 1,000 rows</button>
      <button id="update" class="btn" @click="update">Update every 10th row</button>
      <button id="clear" class="btn" @click="clear">Clear</button>
      <button id="swaprows" class="btn" @click="swaprows">Swap Rows</button>
    </div>
    <table>
      <tbody id="tbody">
        <tr v-for="item in data" :key="item.id" :class="{ danger: item.id === selected }">
          <td class="col-md-1">{{ item.id }}</td>
          <td class="col-md-4"><a class="lbl" @click="select(item.id)">{{ item.label }}</a></td>
          <td class="col-md-1"><a class="remove" @click="remove(item.id)">✖</a></td>
          <td class="col-md-6"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <script>
    const adjectives = ["pretty", "large", "big", "small", "tall", "short", "long", "handsome", "plain", "quaint", "clean", "elegant", "easy", "angry", "crazy", "helpful", "mushy", "odd", "unsightly", "adorable", "important", "inexpensive", "cheap", "expensive", "fancy"];
    const colours = ["red", "yellow", "blue", "green", "pink", "brown", "purple", "white", "black", "orange"];
    const nouns = ["table", "chair", "house", "bbq", "desk", "car", "pony", "cookie", "sandwich", "burger", "pizza", "mouse", "keyboard"];

    let nextId = 1;
    function _random(max) { return Math.round(Math.random() * 1000) % max; }
    function buildData(count) {
      const data = new Array(count);
      for (let i = 0; i < count; i++) {
        data[i] = {
          id: nextId++,
          label: adjectives[_random(adjectives.length)] + " " + colours[_random(colours.length)] + " " + nouns[_random(nouns.length)]
        };
      }
      return data;
    }

    const { createApp, ref, shallowRef } = Vue;

    const app = createApp({
      setup() {
        const data = shallowRef([]);
        const selected = ref(null);

        const run = () => { data.value = buildData(1000); selected.value = null; };
        const runlots = () => { data.value = buildData(10000); selected.value = null; };
        const add = () => { data.value = data.value.concat(buildData(1000)); };
        const update = () => {
          const next = data.value.slice();
          for (let i = 0; i < next.length; i += 10) {
            next[i] = { ...next[i], label: next[i].label + ' !!!' };
          }
          data.value = next;
        };
        const clear = () => { data.value = []; selected.value = null; };
        const swaprows = () => {
          if (data.value.length > 998) {
            const next = data.value.slice();
            const temp = next[4];
            next[4] = next[997];
            next[997] = temp;
            data.value = next;
          }
        };

        const select = (id) => { selected.value = id; };
        const remove = (id) => {
          data.value = data.value.filter(item => item.id !== id);
        };

        return { data, selected, run, runlots, add, update, clear, swaprows, select, remove };
      }
    });

    app.mount('#main');
    window.__framework_ready = true;
  </script>
</body>
</html>
