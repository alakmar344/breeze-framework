<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VanillaJS Benchmark</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    .btn { padding: 6px 12px; margin: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    td, th { padding: 8px; border-top: 1px solid #ddd; text-align: left; }
    .col-md-1 { width: 10%; }
    .col-md-4 { width: 40%; }
    .col-md-6 { width: 40%; }
    .danger { background-color: #f2dede; }
    .lbl { cursor: pointer; color: #337ab7; text-decoration: none; }
    .remove { cursor: pointer; color: red; }
  </style>
</head>
<body>
  <div id="main">
    <h1>Vanilla JS Benchmark</h1>
    <div>
      <button id="run" class="btn">Create 1,000 rows</button>
      <button id="runlots" class="btn">Create 10,000 rows</button>
      <button id="add" class="btn">Append 1,000 rows</button>
      <button id="update" class="btn">Update every 10th row</button>
      <button id="clear" class="btn">Clear</button>
      <button id="swaprows" class="btn">Swap Rows</button>
    </div>
    <table>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <script>
    const adjectives = ["pretty", "large", "big", "small", "tall", "short", "long", "handsome", "plain", "quaint", "clean", "elegant", "easy", "angry", "crazy", "helpful", "mushy", "odd", "unsightly", "adorable", "important", "inexpensive", "cheap", "expensive", "fancy"];
    const colours = ["red", "yellow", "blue", "green", "pink", "brown", "purple", "white", "black", "orange"];
    const nouns = ["table", "chair", "house", "bbq", "desk", "car", "pony", "cookie", "sandwich", "burger", "pizza", "mouse", "keyboard"];

    let nextId = 1;
    function _random(max) { return Math.round(Math.random() * 1000) % max; }
    function buildData(count) {
      const data = new Array(count);
      for (let i = 0; i < count; i++) {
        data[i] = {
          id: nextId++,
          label: adjectives[_random(adjectives.length)] + " " + colours[_random(colours.length)] + " " + nouns[_random(nouns.length)]
        };
      }
      return data;
    }

    let data = [];
    let selected = null;
    const tbody = document.getElementById('tbody');

    function createRow(item) {
      const tr = document.createElement('tr');
      if (selected === item.id) tr.className = 'danger';
      tr._id = item.id;
      tr.innerHTML = `<td class="col-md-1">${item.id}</td><td class="col-md-4"><a class="lbl">${item.label}</a></td><td class="col-md-1"><a class="remove">✖</a></td><td class="col-md-6"></td>`;
      return tr;
    }

    function renderAll() {
      tbody.textContent = '';
      const frag = document.createDocumentFragment();
      for (let i = 0; i < data.length; i++) {
        frag.appendChild(createRow(data[i]));
      }
      tbody.appendChild(frag);
    }

    document.getElementById('run').addEventListener('click', () => {
      data = buildData(1000);
      renderAll();
    });

    document.getElementById('runlots').addEventListener('click', () => {
      data = buildData(10000);
      renderAll();
    });

    document.getElementById('add').addEventListener('click', () => {
      const more = buildData(1000);
      const frag = document.createDocumentFragment();
      for (let i = 0; i < more.length; i++) {
        data.push(more[i]);
        frag.appendChild(createRow(more[i]));
      }
      tbody.appendChild(frag);
    });

    document.getElementById('update').addEventListener('click', () => {
      for (let i = 0; i < data.length; i += 10) {
        data[i].label += ' !!!';
        const tr = tbody.children[i];
        if (tr) {
          tr.querySelector('.lbl').textContent = data[i].label;
        }
      }
    });

    document.getElementById('clear').addEventListener('click', () => {
      data = [];
      tbody.textContent = '';
    });

    document.getElementById('swaprows').addEventListener('click', () => {
      if (data.length > 998) {
        const item4 = data[4];
        data[4] = data[997];
        data[997] = item4;

        const row4 = tbody.children[4];
        const row997 = tbody.children[997];
        const ref = row4.nextSibling;
        tbody.insertBefore(row4, row997.nextSibling);
        tbody.insertBefore(row997, ref);
      }
    });

    tbody.addEventListener('click', (e) => {
      const tr = e.target.closest('tr');
      if (!tr) return;
      if (e.target.classList.contains('lbl')) {
        const id = tr._id;
        selected = id;
        for (let i = 0; i < tbody.children.length; i++) {
          tbody.children[i].classList.toggle('danger', tbody.children[i]._id === selected);
        }
      } else if (e.target.classList.contains('remove')) {
        const id = tr._id;
        const idx = data.findIndex(d => d.id === id);
        if (idx !== -1) data.splice(idx, 1);
        tr.remove();
      }
    });

    window.__framework_ready = true;
  </script>
</body>
</html>
