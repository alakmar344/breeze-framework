<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>React TodoMVC Benchmark</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    .btn { padding: 4px 8px; margin: 2px; cursor: pointer; }
    .completed { text-decoration: line-through; color: #888; }
    .todo-item { display: flex; align-items: center; padding: 4px; border-bottom: 1px solid #eee; }
    .todo-title { flex: 1; margin-left: 8px; }
  </style>
  <script src="/vendor/react-19-stack.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const { useState, useEffect } = React;

    function TodoApp() {
      const [items, setItems] = useState([]);
      const [filter, setFilter] = useState('all');

      let filtered = items;
      if (filter === 'active') filtered = items.filter(t => !t.completed);
      else if (filter === 'completed') filtered = items.filter(t => t.completed);

      const create = () => {
        const arr = new Array(100);
        for (let i = 0; i < 100; i++) {
          arr[i] = { id: i + 1, title: 'Todo task #' + (i + 1), completed: false };
        }
        setFilter('all');
        setItems(arr);
      };

      const toggle = () => {
        setItems(prev => {
          const next = prev.slice();
          for (let i = 0; i < next.length; i += 2) {
            next[i] = { ...next[i], completed: !next[i].completed };
          }
          return next;
        });
      };

      const edit = () => {
        setItems(prev => {
          const next = prev.slice();
          for (let i = 0; i < 20 && i < next.length; i++) {
            next[i] = { ...next[i], title: next[i].title + ' (edited)' };
          }
          return next;
        });
      };

      const clearCompleted = () => {
        setItems(prev => prev.filter(t => !t.completed));
      };

      const clearAll = () => {
        setItems([]);
      };

      return React.createElement('div', null,
        React.createElement('h1', null, 'TodoMVC Benchmark'),
        React.createElement('div', { className: 'controls' },
          React.createElement('button', { id: 'btn-create', className: 'btn', onClick: create }, 'Batch Create 100'),
          React.createElement('button', { id: 'btn-toggle', className: 'btn', onClick: toggle }, 'Toggle 50 Completed'),
          React.createElement('button', { id: 'btn-filter-active', className: 'btn', onClick: () => setFilter('active') }, 'Filter Active'),
          React.createElement('button', { id: 'btn-filter-completed', className: 'btn', onClick: () => setFilter('completed') }, 'Filter Completed'),
          React.createElement('button', { id: 'btn-filter-all', className: 'btn', onClick: () => setFilter('all') }, 'Filter All'),
          React.createElement('button', { id: 'btn-edit', className: 'btn', onClick: edit }, 'Edit 20 Items'),
          React.createElement('button', { id: 'btn-clear-completed', className: 'btn', onClick: clearCompleted }, 'Clear Completed'),
          React.createElement('button', { id: 'btn-clear-all', className: 'btn', onClick: clearAll }, 'Clear All')
        ),
        React.createElement('div', { id: 'todo-list' },
          filtered.map(item =>
            React.createElement('div', {
              key: item.id,
              className: 'todo-item' + (item.completed ? ' completed' : '')
            },
              React.createElement('span', { className: 'todo-title' }, item.title)
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(React.createElement(TodoApp));
    setTimeout(() => { window.__framework_ready = true; }, 50);
  </script>
</body>
</html>
