<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Breeze Benchmark</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    .btn { padding: 6px 12px; margin: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    td, th { padding: 8px; border-top: 1px solid #ddd; text-align: left; }
    .col-md-1 { width: 10%; }
    .col-md-4 { width: 40%; }
    .col-md-6 { width: 40%; }
    .danger { background-color: #f2dede; }
    .lbl { cursor: pointer; color: #337ab7; text-decoration: none; }
    .remove { cursor: pointer; color: red; }
  </style>
  <script src="/breeze.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    const adjectives = ["pretty", "large", "big", "small", "tall", "short", "long", "handsome", "plain", "quaint", "clean", "elegant", "easy", "angry", "crazy", "helpful", "mushy", "odd", "unsightly", "adorable", "important", "inexpensive", "cheap", "expensive", "fancy"];
    const colours = ["red", "yellow", "blue", "green", "pink", "brown", "purple", "white", "black", "orange"];
    const nouns = ["table", "chair", "house", "bbq", "desk", "car", "pony", "cookie", "sandwich", "burger", "pizza", "mouse", "keyboard"];

    let nextId = 1;
    function _random(max) { return Math.round(Math.random() * 1000) % max; }
    function buildData(count) {
      const data = new Array(count);
      for (let i = 0; i < count; i++) {
        data[i] = {
          id: nextId++,
          label: adjectives[_random(adjectives.length)] + " " + colours[_random(colours.length)] + " " + nouns[_random(nouns.length)]
        };
      }
      return data;
    }

    Breeze.mount(`
@app "Breeze Benchmark"
@state rows = []
@section #main
  h1 "Breeze Benchmark"
  div
    button "Create 1,000 rows" #run [btn]
    button "Create 10,000 rows" #runlots [btn]
    button "Append 1,000 rows" #add [btn]
    button "Update every 10th row" #update [btn]
    button "Clear" #clear [btn]
    button "Swap Rows" #swaprows [btn]
  table
    @each row in rows [key=id]
      tr
        td.col-md-1 "{row.id}"
        td.col-md-4
          a.lbl "{row.label}"
        td.col-md-1
          a.remove "✖"
        td.col-md-6 ""
`, '#app');

    const tableBody = document.querySelector('.bz-each') || document.querySelector('table');

    document.getElementById('run').addEventListener('click', () => {
      Breeze.setState('rows', buildData(1000));
    });

    document.getElementById('runlots').addEventListener('click', () => {
      Breeze.setState('rows', buildData(10000));
    });

    document.getElementById('add').addEventListener('click', () => {
      const current = Breeze.getState('rows') || [];
      const more = buildData(1000);
      Breeze.setState('rows', current.concat(more));
    });

    document.getElementById('update').addEventListener('click', () => {
      const rows = [...Breeze.getState('rows')];
      for (let i = 0; i < rows.length; i += 10) {
        rows[i] = { ...rows[i], label: rows[i].label + ' !!!' };
      }
      Breeze.setState('rows', rows);
    });

    document.getElementById('clear').addEventListener('click', () => {
      Breeze.setState('rows', []);
    });

    document.getElementById('swaprows').addEventListener('click', () => {
      const rows = [...Breeze.getState('rows')];
      if (rows.length > 998) {
        const item4 = rows[4];
        rows[4] = rows[997];
        rows[997] = item4;
        Breeze.setState('rows', rows);
      }
    });

    tableBody.addEventListener('click', (e) => {
      const tr = e.target.closest('tr') || e.target.closest('.bz-row');
      if (!tr) return;
      if (e.target.classList.contains('lbl')) {
        tr.classList.toggle('danger');
      } else if (e.target.classList.contains('remove')) {
        const id = tr._bzItemKey;
        const rows = Breeze.getState('rows') || [];
        const next = rows.filter(r => r.id !== id);
        Breeze.setState('rows', next);
      }
    });

    window.__framework_ready = true;
  </script>
</body>
</html>
