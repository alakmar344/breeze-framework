<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DBMonster — React 18</title>
  <link rel="stylesheet" href="/dbmonster/dbmonster.css">
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/dbmonster/data.js"></script>
</head>
<body>
  <div id="fps-meter">FPS: ...</div>
  <h1>DBMonster — React 18</h1>
  <div id="app"></div>

  <script>
    const e = React.createElement;
    const root = ReactDOM.createRoot(document.getElementById('app'));

    function App({ databases }) {
      return e('table', { className: 'table' },
        e('tbody', null,
          databases.map(db =>
            e('tr', { key: db.id },
              e('td', { className: 'dbname' }, db.name),
              e('td', { className: 'query-count' },
                e('span', { className: 'badge' }, db.count)
              ),
              db.queries.map((q, idx) =>
                e('td', { key: idx, className: 'Query ' + q.warn }, q.elapsed)
              )
            )
          )
        )
      );
    }

    startBenchmarkLoop((data) => {
      root.render(e(App, { databases: data }));
    });
  </script>
</body>
</html>
